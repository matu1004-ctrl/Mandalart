<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="マンダラート">
<title>マンダラート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --ink:#1c1c1a;
    --ink-soft:#8a8a86;
    --cell-bg:#ffffff;
    --cell-border:#dcdcdc;
    --cell-border-w:1px;
    --center-border:#151515;
    --center-border-w:3px;
    --radius:10px;
    --accent:#B23A2E;
    --gap: clamp(10px, 3.2vw, 18px);
    --topbar-h: 54px;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html,body{ height:100%; overscroll-behavior:none; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Zen Kaku Gothic New", -apple-system, BlinkMacSystemFont, sans-serif;
    display:flex;
    flex-direction:column;
    position:fixed;
    inset:0;
    height:100vh;
    height:100svh;
    overflow:hidden;
  }

  /* top bar */
  .topbar{
    height:var(--topbar-h);
    flex:0 0 var(--topbar-h);
    display:flex;
    align-items:center;
    padding: env(safe-area-inset-top) 6px 0;
    padding-top:max(6px, env(safe-area-inset-top));
    border-bottom:1px solid #eee;
  }
  .backBtn{
    width:40px; height:40px; border:0; background:none; font-size:22px;
    color:var(--ink); display:flex; align-items:center; justify-content:center;
    visibility:hidden; cursor:pointer;
  }
  .backBtn.show{ visibility:visible; }
  .backBtn.longPressReady{ color:var(--accent); }
  .title{
    flex:1; text-align:center; font-family:"Shippori Mincho", serif;
    font-weight:700; font-size:15px; letter-spacing:.03em;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:0 4px;
  }
  .menuWrap{ position:relative; }
  .menuBtn{
    width:40px; height:40px; border:0; background:none; font-size:20px;
    color:var(--ink); cursor:pointer;
  }
  .menu{
    position:absolute; top:44px; right:4px; background:#fff; border:1px solid #e2e2e2;
    border-radius:8px; box-shadow:0 6px 20px rgba(0,0,0,.12); overflow:hidden;
    display:none; min-width:150px; z-index:20;
  }
  .menu.open{ display:block; }
  .menu button{
    display:block; width:100%; text-align:left; padding:11px 14px; border:0; background:none;
    font-family:inherit; font-size:13.5px; color:var(--ink); cursor:pointer;
  }
  .menu button:active{ background:#f3f1ea; }
  .menu button + button{ border-top:1px solid #eee; }

  /* board area */
  .stage{
    flex:1; display:flex; align-items:center; justify-content:center;
    padding:14px; min-height:0; overflow:hidden;
  }
  .board{
    aspect-ratio:1/1;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);
    gap:var(--gap);
    position:relative;
  }
  .cell{
    background:var(--cell-bg);
    border:var(--cell-border-w) solid var(--cell-border);
    border-radius:var(--radius);
    position:relative;
    touch-action:none;
    overflow:hidden;
    transition:box-shadow .15s ease, border-color .12s ease;
  }
  .cell.dragging{ transition:none; }
  .cell.center{
    border:var(--center-border-w) solid var(--center-border);
  }
  .cell.dragging{
    z-index:5;
    box-shadow:0 10px 24px rgba(0,0,0,.18);
    transform:scale(1.04);
  }
  .cell.dropTarget{
    border-color:var(--accent);
    box-shadow: inset 0 0 0 2px var(--accent);
  }
  .cell.longPressReady{
    border-color:var(--accent);
    box-shadow: inset 0 0 0 2px rgba(178,58,46,.35);
  }
  textarea{
    width:100%; height:100%;
    border:0; resize:none; background:transparent;
    font-family:inherit; color:var(--ink);
    font-size: 16px;
    line-height:1.3;
    padding:6px;
    text-align:center;
    outline:none;
    display:flex; align-items:center;
    user-select:text; -webkit-user-select:text;
  }
  .cell textarea{
    pointer-events:none;
    position:absolute;
    top:50%; left:50%;
    width:133.34%; height:133.34%;
    transform: translate(-50%,-50%) scale(0.75);
    transform-origin:center;
  }
  .cell.center textarea{ font-weight:700; }

  /* export modal */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(20,20,18,0.5);
    display:none; align-items:center; justify-content:center; padding:20px; z-index:30;
  }
  .modal-overlay.open{ display:flex; }
  .modal{
    background:#fff; border-radius:10px; padding:16px; width:100%; max-width:480px;
    max-height:78vh; display:flex; flex-direction:column; gap:10px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
  }
  .modal h2{ font-family:"Shippori Mincho",serif; font-size:16px; margin:0; }
  .modal textarea.export-area{
    width:100%; flex:1; min-height:260px; font-size:16px; padding:10px;
    border:1px solid #ddd; border-radius:6px; text-align:left;
    color:var(--ink); resize:vertical; user-select:text; -webkit-user-select:text;
  }
  .modal-actions{ display:flex; gap:8px; justify-content:flex-end; }
  .modal-actions button{
    font-family:inherit; font-size:13px; padding:9px 14px; border-radius:6px;
    border:1px solid #ddd; background:#fff; cursor:pointer;
  }
  .modal-actions button.primary{ background:var(--ink); color:#fff; border-color:var(--ink); }

  /* bottom bar / big button */
  .bottombar{
    flex:0 0 auto;
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
  }
  .bigBtn{
    width:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px;
    padding:12px 10px;
    border:0; border-radius:14px;
    background:#2b2b28;
    color:#fff;
    font-family:inherit;
    cursor:pointer;
    touch-action:none;
    transition:background .12s ease, transform .1s ease;
  }
  .bigBtn .main{ font-size:14px; font-weight:700; letter-spacing:.02em; }
  .bigBtn .sub{ font-size:10.5px; opacity:.75; }
  .bigBtn.pressed{ background:var(--accent); transform:scale(0.99); }
  .bigBtn.mode-close{ background:var(--accent); }

  /* long-text focused writing view */
  .longtext{
    display:none;
    flex-direction:column;
    width:100%; height:100%;
  }
  .longtext.show{ display:flex; }
  .longtext .lt-label{
    font-family:"Shippori Mincho", serif;
    font-weight:700;
    font-size:14px;
    color:var(--ink-soft);
    text-align:center;
    padding-bottom:10px;
  }
  .longtext textarea{
    flex:1;
    width:100%;
    border:0;
    resize:none;
    background:transparent;
    font-family:inherit;
    color:var(--ink);
    font-size:16px;
    line-height:1.7;
    padding:4px 2px;
    text-align:left;
    outline:none;
    display:block;
    user-select:text; -webkit-user-select:text;
  }
</style>
</head>
<body>

<div class="topbar">
  <button class="backBtn" id="backBtn" aria-label="戻る">‹</button>
  <div class="title" id="titleEl">マンダラート</div>
  <div class="menuWrap">
    <button class="menuBtn" id="menuBtn" aria-label="メニュー">⋯</button>
    <div class="menu" id="menu">
      <button id="exportBtn">書き出す（テキスト）</button>
      <button id="exportMdBtn">書き出す（Markdown）</button>
      <button id="exportWfBtn">書き出す（Workflowy）</button>
      <button id="resetBtn">クリア</button>
    </div>
  </div>
</div>

<div class="stage">
  <div class="board" id="board"></div>
  <div class="longtext" id="longtext">
    <div class="lt-label" id="ltLabel"></div>
    <textarea id="ltArea" placeholder="ここに自由に書けます"></textarea>
  </div>
</div>

<div class="bottombar">
  <button class="bigBtn" id="bigBtn">
    <span class="main" id="bigBtnMain">長文モード</span>
    <span class="sub" id="bigBtnSub">押しながらセルへドラッグして開く</span>
  </button>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2>テキストとして書き出し</h2>
    <textarea class="export-area" id="exportArea" readonly></textarea>
    <div class="modal-actions">
      <button id="copyBtn">コピー</button>
      <button class="primary" id="closeModalBtn">閉じる</button>
    </div>
  </div>
</div>

<script>
(function(){
  const STORAGE_KEY = 'mandalart:state';

  // Each node is one 3x3 board (9 cells, index 4 = center). Non-center cells can be
  // expanded into a child node (created lazily), which itself can be expanded further,
  // to any depth. The child's center cell always mirrors the parent's cell that opened it.
  function makeNode(){
    return { cells: Array(9).fill(''), children: new Array(9).fill(null) };
  }
  let root = makeNode();
  // navPath: [{node, idx}] from root (idx=null) down to the node currently on screen.
  let navPath = [{ node: root, idx: null }];

  function currentNode(){ return navPath[navPath.length - 1].node; }
  function atRoot(){ return navPath.length === 1; }

  const boardEl = document.getElementById('board');
  const titleEl = document.getElementById('titleEl');
  const backBtn = document.getElementById('backBtn');
  const menuBtn = document.getElementById('menuBtn');
  const menu = document.getElementById('menu');
  const longtextEl = document.getElementById('longtext');
  const ltLabel = document.getElementById('ltLabel');
  const ltArea = document.getElementById('ltArea');
  const bigBtn = document.getElementById('bigBtn');
  const bigBtnMain = document.getElementById('bigBtnMain');
  const bigBtnSub = document.getElementById('bigBtnSub');
  let longTextTarget = null; // { c } or null

  // Keeps a cell's text in sync with the node it opens into (and the node it came from).
  function syncMirror(c){
    const node = currentNode();
    if (c === 4){
      if (!atRoot()){
        const parentEntry = navPath[navPath.length - 2];
        const myIdx = navPath[navPath.length - 1].idx;
        parentEntry.node.cells[myIdx] = node.cells[4];
      }
    } else if (node.children[c]){
      node.children[c].cells[4] = node.cells[c];
    }
  }

  function swapCells(i, j){
    if (i === j) return;
    const node = currentNode();
    const tmpCell = node.cells[i];
    node.cells[i] = node.cells[j];
    node.cells[j] = tmpCell;
    const tmpChild = node.children[i];
    node.children[i] = node.children[j];
    node.children[j] = tmpChild;
    syncMirror(i);
    syncMirror(j);
  }

  // Shared drag state so pointerup always finishes/cancels correctly (iOS capture can fail).
  let dragState = null;

  function cancelDrag(){
    if (!dragState) return;
    const { cellEl, dropTargetEl } = dragState;
    if (cellEl){
      cellEl.style.transform = '';
      cellEl.classList.remove('dragging');
      cellEl.style.pointerEvents = '';
    }
    if (dropTargetEl) dropTargetEl.classList.remove('dropTarget');
    dragState = null;
  }

  function finishDrag(){
    if (!dragState) return;
    const { sourceC, dropTargetEl } = dragState;
    const targetC = dropTargetEl ? Number(dropTargetEl.dataset.c) : null;
    cancelDrag();
    if (targetC !== null && targetC !== sourceC){
      swapCells(sourceC, targetC);
      render();
      scheduleSave();
    }
  }

  function onDragMove(e){
    if (!dragState) return;
    const { cellEl, startX, startY } = dragState;
    const moveX = e.clientX - startX, moveY = e.clientY - startY;
    cellEl.style.transform = `translate(${moveX}px, ${moveY}px) scale(1.04)`;

    if (dragState.dropTargetEl){
      dragState.dropTargetEl.classList.remove('dropTarget');
      dragState.dropTargetEl = null;
    }
    const under = document.elementFromPoint(e.clientX, e.clientY);
    const cand = under ? under.closest('.cell') : null;
    if (cand && cand !== cellEl && boardEl.contains(cand)){
      cand.classList.add('dropTarget');
      dragState.dropTargetEl = cand;
    }
  }

  function onDragEnd(){
    if (!dragState) return;
    finishDrag();
    document.removeEventListener('pointermove', onDragMove);
    document.removeEventListener('pointerup', onDragEnd);
    document.removeEventListener('pointercancel', onDragCancel);
  }

  function onDragCancel(){
    cancelDrag();
    document.removeEventListener('pointermove', onDragMove);
    document.removeEventListener('pointerup', onDragEnd);
    document.removeEventListener('pointercancel', onDragCancel);
  }

  function startDrag(cellEl, c, startX, startY){
    dragState = { sourceC: c, cellEl, dropTargetEl: null, startX, startY };
    cellEl.classList.add('dragging');
    cellEl.style.pointerEvents = 'none';
    document.addEventListener('pointermove', onDragMove);
    document.addEventListener('pointerup', onDragEnd);
    document.addEventListener('pointercancel', onDragCancel);
  }

  function render(){
    const node = currentNode();
    // title / back button
    if (atRoot()){
      backBtn.classList.remove('show');
      titleEl.textContent = node.cells[4] ? node.cells[4] : 'マンダラート';
    } else {
      backBtn.classList.add('show');
      const idx = navPath[navPath.length - 1].idx;
      titleEl.textContent = node.cells[4] ? node.cells[4] : 'テーマ ' + (idx + 1);
    }

    boardEl.innerHTML = '';
    for (let c = 0; c < 9; c++){
      const cellEl = document.createElement('div');
      cellEl.className = 'cell' + (c === 4 ? ' center' : '');
      cellEl.dataset.c = c;

      const ta = document.createElement('textarea');
      ta.value = node.cells[c];
      ta.setAttribute('placeholder', (atRoot() && c === 4) ? '目標' : '');
      ta.addEventListener('input', () => {
        node.cells[c] = ta.value;
        syncMirror(c);
        if (atRoot() && c === 4){ titleEl.textContent = ta.value || 'マンダラート'; }
        scheduleSave();
      });
      cellEl.appendChild(ta);
      boardEl.appendChild(cellEl);
      attachGestures(cellEl, ta, c);
    }
  }

  function canExpand(c){
    if (c === 4) return !atRoot();
    return true; // any non-center cell can always drill deeper, to any depth
  }

  function expand(c){
    if (c === 4){
      if (atRoot()) return;
      navPath.pop();
    } else {
      const node = currentNode();
      if (!node.children[c]) node.children[c] = makeNode();
      const child = node.children[c];
      child.cells[4] = node.cells[c];
      navPath.push({ node: child, idx: c });
    }
    if (document.activeElement) document.activeElement.blur();
    render();
    scheduleSave();
  }

  // ---- gestures: tap-to-edit, long-press to expand/back, long-press+drag to swap ----
  const LONG_PRESS_MS = 320;
  const MOVE_CANCEL_PX = 28;

  let backPressTimer = null;
  let backPressReady = false;

  backBtn.addEventListener('pointerdown', () => {
    if (atRoot()) return;
    backPressReady = false;
    clearTimeout(backPressTimer);
    backBtn.classList.remove('longPressReady');
    backPressTimer = setTimeout(() => {
      backPressReady = true;
      backBtn.classList.add('longPressReady');
    }, LONG_PRESS_MS);
  });
  backBtn.addEventListener('pointerup', () => {
    clearTimeout(backPressTimer);
    backBtn.classList.remove('longPressReady');
    if (backPressReady && !atRoot()){
      navPath = [navPath[0]];
      render();
      scheduleSave();
    }
    backPressReady = false;
  });
  backBtn.addEventListener('pointercancel', () => {
    clearTimeout(backPressTimer);
    backBtn.classList.remove('longPressReady');
    backPressReady = false;
  });

  function attachGestures(cellEl, ta, c){
    ta.style.pointerEvents = 'none';
    ta.addEventListener('focus', () => { ta.style.pointerEvents = 'auto'; });
    ta.addEventListener('blur', () => { ta.style.pointerEvents = 'none'; });

    let lpTimer = null;
    let lpReady = false;
    let startX = 0, startY = 0;

    function isEditing(){ return document.activeElement === ta; }

    function beginPress(e){
      startX = e.clientX; startY = e.clientY;
      lpReady = false;
      clearTimeout(lpTimer);
      cellEl.classList.remove('longPressReady');
      lpTimer = setTimeout(() => {
        lpReady = true;
        cellEl.classList.add('longPressReady');
      }, LONG_PRESS_MS);
    }

    function cancelPress(){
      clearTimeout(lpTimer);
      lpReady = false;
      cellEl.classList.remove('longPressReady');
    }

    function onMove(e){
      if (dragState) return;
      const dx = Math.abs(e.clientX - startX), dy = Math.abs(e.clientY - startY);
      if (!lpReady){
        if (dx > MOVE_CANCEL_PX || dy > MOVE_CANCEL_PX) cancelPress();
        return;
      }
      if (isEditing()) return;
      if (dx > MOVE_CANCEL_PX || dy > MOVE_CANCEL_PX){
        cancelPress();
        startDrag(cellEl, c, startX, startY);
      }
    }

    function onUp(){
      if (dragState) return;
      const wasReady = lpReady;
      cancelPress();

      if (wasReady){
        if (canExpand(c)) expand(c);
        return;
      }

      if (!isEditing()){
        if (bigButtonHeld){
          if (!longTextTarget) openLongText(c);
          return;
        }
        ta.focus();
      }
    }

    function onCancel(){
      cancelPress();
    }

    cellEl.addEventListener('pointerdown', (e) => {
      if (isEditing()) return;
      beginPress(e);
    });
    cellEl.addEventListener('pointermove', onMove);
    cellEl.addEventListener('pointerup', onUp);
    cellEl.addEventListener('pointercancel', onCancel);

    ta.addEventListener('pointerdown', (e) => {
      if (!isEditing()) return;
      beginPress(e);
    });
    ta.addEventListener('pointermove', onMove);
    ta.addEventListener('pointerup', onUp);
    ta.addEventListener('pointercancel', onCancel);
  }

  // ---- persistence (browser localStorage: works on any normal hosted page) ----
  let saveTimer = null;
  function scheduleSave(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveData, 400);
  }
  function saveData(){
    try{
      const path = navPath.slice(1).map((entry) => entry.idx);
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ root, path }));
    }catch(err){ console.error('save failed', err); }
  }
  function normalizeNode(raw){
    const node = makeNode();
    if (raw && Array.isArray(raw.cells)){
      for (let i = 0; i < 9; i++){
        node.cells[i] = typeof raw.cells[i] === 'string' ? raw.cells[i] : '';
      }
    }
    if (raw && Array.isArray(raw.children)){
      for (let i = 0; i < 9; i++){
        if (raw.children[i]) node.children[i] = normalizeNode(raw.children[i]);
      }
    }
    return node;
  }
  function loadData(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw){
        const parsed = JSON.parse(raw);
        if (parsed && parsed.root){
          root = normalizeNode(parsed.root);
          navPath = [{ node: root, idx: null }];
          if (Array.isArray(parsed.path)){
            let node = root;
            for (const idx of parsed.path){
              if (node.children[idx]){
                node = node.children[idx];
                navPath.push({ node, idx });
              } else break;
            }
          }
        } else if (Array.isArray(parsed.grid) && parsed.grid.length === 9){
          // migrate from the old flat 9x9 format
          root = makeNode();
          root.cells = parsed.grid[4].slice();
          for (let i = 0; i < 9; i++){
            if (i === 4) continue;
            const hasContent = parsed.grid[i].some((v, idx) => idx !== 4 && v);
            if (hasContent){
              const child = makeNode();
              child.cells = parsed.grid[i].slice();
              root.children[i] = child;
            }
          }
          navPath = [{ node: root, idx: null }];
        }
      }
    }catch(err){ /* fresh start */ }
    render();
  }

  // ---- menu / export / reset ----
  menuBtn.addEventListener('pointerup', (e) => { e.stopPropagation(); menu.classList.toggle('open'); });
  document.addEventListener('pointerup', () => menu.classList.remove('open'));

  const overlay = document.getElementById('modalOverlay');
  const exportArea = document.getElementById('exportArea');

  // visual ring order matching the diagram's numbering: bottom-mid, bottom-left, mid-left,
  // top-left, top-mid, top-right, mid-right, bottom-right (starts at 6 o'clock, sweeps around)
  const RING_ORDER = [7, 6, 3, 0, 1, 2, 5, 8];

  function buildExportText(){
    let out = '=== マンダラート ===\n\n';
    out += `中心ゴール: ${root.cells[4] || '(未入力)'}\n\n`;
    function renderDetails(node, depth){
      let s = '';
      RING_ORDER.forEach((idx) => {
        const val = node.cells[idx];
        if (val) s += '  '.repeat(depth) + `・${val}\n`;
        if (node.children[idx]) s += renderDetails(node.children[idx], depth + 1);
      });
      return s;
    }
    RING_ORDER.forEach((themeIdx, i) => {
      const theme = root.cells[themeIdx] || `(未入力)`;
      out += `◆ テーマ${i + 1}: ${theme}\n`;
      if (root.children[themeIdx]) out += renderDetails(root.children[themeIdx], 1);
      out += '\n';
    });
    return out;
  }

  function buildMarkdownText(){
    let out = `# ${root.cells[4] || '目標'}\n\n`;
    function renderDetails(node, indent){
      let s = '';
      RING_ORDER.forEach((idx) => {
        const val = node.cells[idx];
        if (val) s += '  '.repeat(indent) + `- ${val}\n`;
        if (node.children[idx]) s += renderDetails(node.children[idx], indent + 1);
      });
      return s;
    }
    RING_ORDER.forEach((themeIdx, i) => {
      const theme = root.cells[themeIdx] || `テーマ ${i + 1}`;
      out += `## ${theme}\n`;
      if (root.children[themeIdx]) out += renderDetails(root.children[themeIdx], 0);
      out += '\n';
    });
    return out;
  }

  function buildWorkflowyText(){
    const goal = (root.cells[4] || '').trim();
    let out = `- ${goal || '目標'}\n`;
    function renderDetails(node, depth){
      let s = '';
      RING_ORDER.forEach((idx) => {
        const val = (node.cells[idx] || '').trim();
        const child = node.children[idx];
        if (!val && !child) return;
        s += '  '.repeat(depth) + `- ${val}\n`;
        if (child) s += renderDetails(child, depth + 1);
      });
      return s;
    }
    RING_ORDER.forEach((themeIdx, i) => {
      const theme = (root.cells[themeIdx] || '').trim();
      const child = root.children[themeIdx];
      const childLines = child ? renderDetails(child, 2) : '';
      if (!theme && !childLines) return;
      out += `  - ${theme || `テーマ ${i + 1}`}\n`;
      out += childLines;
    });
    return out;
  }

  document.getElementById('exportBtn').addEventListener('pointerup', () => {
    menu.classList.remove('open');
    exportArea.value = buildExportText();
    overlay.classList.add('open');
  });
  document.getElementById('exportMdBtn').addEventListener('pointerup', () => {
    menu.classList.remove('open');
    exportArea.value = buildMarkdownText();
    overlay.classList.add('open');
  });
  document.getElementById('exportWfBtn').addEventListener('pointerup', () => {
    menu.classList.remove('open');
    exportArea.value = buildWorkflowyText();
    overlay.classList.add('open');
  });
  document.getElementById('closeModalBtn').addEventListener('pointerup', () => overlay.classList.remove('open'));
  overlay.addEventListener('pointerup', (e) => { if (e.target === overlay) overlay.classList.remove('open'); });
  document.getElementById('copyBtn').addEventListener('pointerup', async () => {
    try{
      await navigator.clipboard.writeText(exportArea.value);
      document.getElementById('copyBtn').textContent = 'コピーしました';
    }catch(e){
      exportArea.select();
      document.execCommand && document.execCommand('copy');
      document.getElementById('copyBtn').textContent = '選択済み（手動でコピー）';
    }
    setTimeout(() => { document.getElementById('copyBtn').textContent = 'コピー'; }, 1500);
  });
  document.getElementById('resetBtn').addEventListener('pointerup', () => {
    menu.classList.remove('open');
    if (!confirm('すべての内容をクリアします。よろしいですか？')) return;
    root = makeNode();
    navPath = [{ node: root, idx: null }];
    render();
    try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  });

  // ---- long-text focused writing mode ----
  function cellLabel(c){
    const node = currentNode();
    if (atRoot() && c === 4) return '中心ゴール';
    if (atRoot()) return node.cells[c] ? node.cells[c] : `テーマ ${c + 1}`;
    if (c === 4) return node.cells[4] ? node.cells[4] : 'テーマに戻る';
    return `詳細 ${c + 1}`;
  }

  function openLongText(c){
    if (document.activeElement) document.activeElement.blur();
    longTextTarget = { c: c };
    ltArea.value = currentNode().cells[c];
    ltLabel.textContent = cellLabel(c);
    boardEl.style.display = 'none';
    longtextEl.classList.add('show');
    bigBtnMain.textContent = 'グリッドに戻る';
    bigBtnSub.textContent = 'このボタンを押すと戻ります';
    bigBtn.classList.add('mode-close');
    ltArea.focus();
  }

  function closeLongText(){
    if (longTextTarget){
      currentNode().cells[longTextTarget.c] = ltArea.value;
      syncMirror(longTextTarget.c);
      longTextTarget = null;
      scheduleSave();
    }
    longtextEl.classList.remove('show');
    boardEl.style.display = '';
    bigBtnMain.textContent = '長文モード';
    bigBtnSub.textContent = '押しながらセルへドラッグして開く';
    bigBtn.classList.remove('mode-close');
    render();
  }

  ltArea.addEventListener('input', () => {
    if (!longTextTarget) return;
    currentNode().cells[longTextTarget.c] = ltArea.value;
    syncMirror(longTextTarget.c);
    scheduleSave();
  });

  let bigButtonHeld = false, heldPointerId = null, bigHoverCell = null;
  bigBtn.addEventListener('pointerdown', (e) => {
    bigButtonHeld = true;
    heldPointerId = e.pointerId;
    bigBtn.classList.add('pressed');
  });
  document.addEventListener('pointermove', (e) => {
    if (!bigButtonHeld || e.pointerId !== heldPointerId || longTextTarget) return;
    if (bigHoverCell){ bigHoverCell.classList.remove('dropTarget'); bigHoverCell = null; }
    const under = document.elementFromPoint(e.clientX, e.clientY);
    const cand = under ? under.closest('.cell') : null;
    if (cand && boardEl.contains(cand)){ cand.classList.add('dropTarget'); bigHoverCell = cand; }
  });
  document.addEventListener('pointerup', (e) => {
    if (e.pointerId !== heldPointerId) return;
    const wasHeld = bigButtonHeld;
    bigButtonHeld = false; heldPointerId = null;
    bigBtn.classList.remove('pressed');
    if (bigHoverCell){ bigHoverCell.classList.remove('dropTarget'); bigHoverCell = null; }
    if (!wasHeld) return;

    // iOS keeps touch events targeted at the element pointerdown started on, regardless of
    // where the finger is at release, so find the real element under the finger ourselves.
    const under = document.elementFromPoint(e.clientX, e.clientY);
    const onButton = !!(under && (under === bigBtn || bigBtn.contains(under)));
    const cellEl = under ? under.closest('.cell') : null;

    if (longTextTarget){
      if (onButton) closeLongText();
      return;
    }
    if (cellEl && boardEl.contains(cellEl)){
      openLongText(Number(cellEl.dataset.c));
    }
  });
  document.addEventListener('pointercancel', (e) => {
    if (e.pointerId === heldPointerId){
      bigButtonHeld = false; heldPointerId = null;
      bigBtn.classList.remove('pressed');
      if (bigHoverCell){ bigHoverCell.classList.remove('dropTarget'); bigHoverCell = null; }
    }
  });

  document.addEventListener('pointerdown', (e) => {
    const active = document.activeElement;
    if (active && active.tagName === 'TEXTAREA' && boardEl.contains(active) && !e.target.closest('.cell')){
      active.blur();
    }
  });

  loadData();
  function sizeBoard(){
    const stage = document.querySelector('.stage');
    if (!stage) return;
    const size = Math.max(0, Math.min(stage.clientWidth, stage.clientHeight));
    boardEl.style.width = size + 'px';
    boardEl.style.height = size + 'px';
  }
  window.addEventListener('resize', sizeBoard);
  window.addEventListener('orientationchange', sizeBoard);
  sizeBoard();
  // layout can shift slightly after the first paint (fonts, safe-area insets settling),
  // so re-measure a couple of times shortly after load to make sure the square is accurate
  requestAnimationFrame(() => requestAnimationFrame(sizeBoard));
  setTimeout(sizeBoard, 300);
})();
</script>
</body>
</html>
