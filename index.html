<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="マンダラート">
<title>マンダラート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --ink:#1c1c1a;
    --ink-soft:#8a8a86;
    --cell-bg:#ffffff;
    --cell-border:#dcdcdc;
    --cell-border-w:1px;
    --center-border:#151515;
    --center-border-w:3px;
    --radius:10px;
    --accent:#B23A2E;
    --gap: clamp(10px, 3.2vw, 18px);
    --topbar-h: 64px;
    --cell-font-size: 16px;
    --cell-font-family: "Zen Kaku Gothic New", -apple-system, BlinkMacSystemFont, sans-serif;
    --ui-font-size: 36px;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html,body{ height:100%; overscroll-behavior:none; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Zen Kaku Gothic New", -apple-system, BlinkMacSystemFont, sans-serif;
    display:flex;
    flex-direction:column;
    position:fixed;
    inset:0;
    height:100vh;
    height:100svh;
    overflow:hidden;
  }

  /* top bar */
  .topbar{
    height:var(--topbar-h);
    flex:0 0 var(--topbar-h);
    display:flex;
    align-items:center;
    padding: env(safe-area-inset-top) 6px 0;
    padding-top:max(6px, env(safe-area-inset-top));
    border-bottom:1px solid #eee;
  }
  .backBtn{
    width:40px; height:40px; border:0; background:none; font-size:22px;
    color:var(--ink); display:flex; align-items:center; justify-content:center;
    visibility:hidden; cursor:pointer;
  }
  .backBtn.show{ visibility:visible; }
  .backBtn.longPressReady{ color:var(--accent); }
  .title{
    flex:1; text-align:center; font-family:"Shippori Mincho", serif;
    font-weight:700; font-size:15px; letter-spacing:.03em;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:0 4px;
  }
  .menuWrap{ position:relative; }
  .menuBtn{
    min-width:52px; height:52px; border:0; background:none;
    font-size:36px !important; line-height:1;
    color:var(--ink); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    padding:0 6px;
  }

  /* floating menu (usable while a cell is focused / keyboard open) */
  .fab-wrap{
    position:fixed;
    right:max(12px, env(safe-area-inset-right));
    bottom:calc(88px + env(safe-area-inset-bottom) + var(--fab-keyboard-offset, 0px));
    z-index:50;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:10px;
    pointer-events:none;
    transition:bottom .12s ease;
  }
  .fab-wrap > *{ pointer-events:auto; }
  .fab-target{
    max-width:70vw;
    padding:8px 12px;
    border-radius:10px;
    background:rgba(43,43,40,.92);
    color:#fff;
    font-size:36px !important;
    line-height:1.2;
    display:none;
  }
  .fab-target.show{ display:block; }
  .fab-menu{
    display:none;
    background:#fff;
    border:1px solid #e2e2e2;
    border-radius:12px;
    box-shadow:0 10px 28px rgba(0,0,0,.2);
    overflow:hidden;
    min-width:min(92vw, 440px);
    max-height:min(60vh, 520px);
    overflow-y:auto;
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
  }
  .fab-menu.open{ display:block; }
  .fab-menu button{
    display:block; width:100%; text-align:left;
    padding:16px 18px; border:0; background:none;
    font-family:"Zen Kaku Gothic New", -apple-system, BlinkMacSystemFont, sans-serif;
    font-size:36px !important;
    line-height:1.25;
    color:var(--ink);
    cursor:pointer;
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
  }
  .fab-menu button:active{ background:#f3f1ea; }
  .fab-menu button + button{ border-top:1px solid #eee; }
  .fab-btn{
    width:64px; height:64px; border:0; border-radius:50%;
    background:#2b2b28; color:#fff;
    font-size:36px !important; line-height:1;
    box-shadow:0 8px 20px rgba(0,0,0,.25);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .fab-btn:active{ background:var(--accent); }

  /* board area */
  .stage{
    flex:1; display:flex; align-items:center; justify-content:center;
    padding:14px; min-height:0; overflow:hidden;
  }
  .board{
    aspect-ratio:1/1;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);
    gap:var(--gap);
    position:relative;
  }
  .cell{
    background:var(--cell-bg);
    border:var(--cell-border-w) solid var(--cell-border);
    border-radius:var(--radius);
    position:relative;
    touch-action:none;
    overflow:hidden;
    transition:box-shadow .15s ease, border-color .12s ease;
  }
  .cell.dragging{ transition:none; }
  .cell.center{
    border:var(--center-border-w) solid var(--center-border);
  }
  .cell.dragging{
    z-index:5;
    box-shadow:0 10px 24px rgba(0,0,0,.18);
    transform:scale(1.04);
  }
  .cell.dropTarget{
    border-color:var(--accent);
    box-shadow: inset 0 0 0 2px var(--accent);
  }
  .cell.longPressReady{
    border-color:var(--accent);
    box-shadow: inset 0 0 0 2px rgba(178,58,46,.35);
  }
  textarea, .cell-editor, .lt-editor{
    width:100%; height:100%;
    border:0; resize:none; background:transparent;
    font-family:var(--cell-font-family); color:var(--ink);
    font-size: var(--cell-font-size);
    line-height:1.3;
    padding:6px;
    text-align:center;
    outline:none;
    user-select:text; -webkit-user-select:text;
  }
  /* IMPORTANT: do not use display:flex/grid on .cell-editor itself.
     Bold/underline wrap text in <b>/<span>; flex would treat those as
     separate items and stack characters vertically. */
  .cell-editor-wrap{
    position:absolute;
    top:50%; left:50%;
    width:133.34%; height:133.34%;
    transform: translate(-50%,-50%) scale(0.75);
    transform-origin:center;
    pointer-events:none;
    overflow:hidden;
  }
  .cell-placeholder{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    color:var(--ink-soft);
    font-family:var(--cell-font-family);
    font-size:var(--cell-font-size);
    pointer-events:none;
    z-index:0;
  }
  .cell-editor-wrap.is-filled .cell-placeholder,
  .cell-editor-wrap.is-focused .cell-placeholder{ display:none; }
  .cell-editor{
    display:block;
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    max-height:none;
    box-sizing:border-box;
    white-space:pre-wrap;
    word-break:break-word;
    overflow-y:auto;
    overflow-x:hidden;
    text-align:center;
    min-height:100%;
    z-index:1;
    touch-action:auto;
    -webkit-user-select:text;
    user-select:text;
  }
  .cell .cell-editor{ pointer-events:none; }
  .cell.editing{ touch-action:auto; }
  .cell.editing .cell-editor{ pointer-events:auto; }
  .cell.center .cell-editor{ font-weight:700; }
  .cell-editor b, .cell-editor strong, .lt-editor b, .lt-editor strong{ font-weight:700; }
  .cell-editor u, .lt-editor u{ text-decoration:underline; }

  /* export modal */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(20,20,18,0.5);
    display:none; align-items:center; justify-content:center; padding:20px; z-index:30;
  }
  .modal-overlay.open{ display:flex; }
  .modal{
    background:#fff; border-radius:10px; padding:16px; width:100%; max-width:480px;
    max-height:78vh; display:flex; flex-direction:column; gap:10px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
  }
  .modal h2{ font-family:"Shippori Mincho",serif; font-size:16px; margin:0; }
  .modal textarea.export-area{
    width:100%; flex:1; min-height:260px; font-size:16px; padding:10px;
    border:1px solid #ddd; border-radius:6px; text-align:left;
    color:var(--ink); resize:vertical; user-select:text; -webkit-user-select:text;
  }
  .modal-actions{ display:flex; gap:8px; justify-content:flex-end; }
  .modal-actions button{
    font-family:inherit; font-size:13px; padding:9px 14px; border-radius:6px;
    border:1px solid #ddd; background:#fff; cursor:pointer;
  }
  .modal-actions button.primary{ background:var(--ink); color:#fff; border-color:var(--ink); }

  /* bottom bar / big button */
  .bottombar{
    flex:0 0 auto;
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
  }
  .bigBtn{
    width:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px;
    padding:12px 10px;
    border:0; border-radius:14px;
    background:#2b2b28;
    color:#fff;
    font-family:inherit;
    cursor:pointer;
    touch-action:none;
    transition:background .12s ease, transform .1s ease;
  }
  .bigBtn .main{ font-size:14px; font-weight:700; letter-spacing:.02em; }
  .bigBtn .sub{ font-size:10.5px; opacity:.75; }
  .bigBtn.pressed{ background:var(--accent); transform:scale(0.99); }
  .bigBtn.mode-close{ background:var(--accent); }

  /* long-text focused writing view */
  .longtext{
    display:none;
    flex-direction:column;
    width:100%; height:100%;
  }
  .longtext.show{ display:flex; }
  .longtext .lt-label{
    font-family:"Shippori Mincho", serif;
    font-weight:700;
    font-size:14px;
    color:var(--ink-soft);
    text-align:center;
    padding-bottom:10px;
  }
  .longtext .lt-editor{
    flex:1;
    width:100%;
    height:auto;
    border:0;
    background:transparent;
    font-family:var(--cell-font-family);
    color:var(--ink);
    font-size:var(--cell-font-size);
    line-height:1.7;
    padding:4px 2px;
    text-align:left;
    outline:none;
    display:block;
    white-space:pre-wrap;
    word-break:break-word;
    overflow:auto;
    user-select:text; -webkit-user-select:text;
  }
  .longtext .lt-editor:empty::before{
    content:attr(data-placeholder);
    color:var(--ink-soft);
    pointer-events:none;
  }

  /* selection format bar */
  .fmt-bar{
    position:fixed; z-index:40; display:none;
    gap:6px; padding:6px; border-radius:10px;
    background:#2b2b28; box-shadow:0 8px 24px rgba(0,0,0,.22);
  }
  .fmt-bar.show{ display:flex; }
  .fmt-bar button{
    min-width:40px; height:36px; border:0; border-radius:7px;
    background:#fff; color:var(--ink); font-family:inherit;
    font-size:14px; cursor:pointer; padding:0 10px;
  }
  .fmt-bar button:active{ background:#f3f1ea; }

  /* style settings */
  .style-form{ display:flex; flex-direction:column; gap:14px; }
  .style-row{ display:flex; flex-direction:column; gap:6px; }
  .style-row label{ font-size:12px; color:var(--ink-soft); }
  .style-row select{
    font-family:inherit; font-size:14px; padding:10px 12px;
    border:1px solid #ddd; border-radius:6px; background:#fff; color:var(--ink);
  }
  .style-preview{
    border:1px solid #eee; border-radius:8px; padding:14px;
    text-align:center; font-family:var(--cell-font-family);
    font-size:var(--cell-font-size); line-height:1.4; color:var(--ink);
    min-height:48px;
  }

  .paste-area{
    width:100%; min-height:220px; font-size:14px; padding:10px;
    border:1px solid #ddd; border-radius:6px; text-align:left;
    color:var(--ink); resize:vertical; font-family:ui-monospace, SFMono-Regular, Menlo, monospace;
    line-height:1.45; user-select:text; -webkit-user-select:text;
  }
  .paste-hint{ font-size:12px; color:var(--ink-soft); line-height:1.45; margin:0; }
</style>
</head>
<body>

<div class="topbar">
  <button class="backBtn" id="backBtn" aria-label="戻る">‹</button>
  <div class="title" id="titleEl">マンダラート</div>
  <div class="menuWrap">
    <button class="menuBtn" id="menuBtn" aria-label="メニュー">⋯</button>
  </div>
</div>

<div class="stage">
  <div class="board" id="board"></div>
  <div class="longtext" id="longtext">
    <div class="lt-label" id="ltLabel"></div>
    <div class="lt-editor" id="ltArea" contenteditable="true" data-placeholder="ここに自由に書けます"></div>
  </div>
</div>

<div class="fab-wrap" id="fabWrap">
  <div class="fab-target" id="fabTarget"></div>
  <div class="fab-menu" id="menu">
    <button type="button" id="exportBtn">書き出す（テキスト）</button>
    <button type="button" id="exportMdBtn">書き出す（Markdown）</button>
    <button type="button" id="exportWfBtn">書き出す（Workflowy）</button>
    <button type="button" id="importOutlineBtn">アウトラインを取り込む</button>
    <button type="button" id="styleBtn">文字スタイル</button>
    <button type="button" id="resetBtn">クリア</button>
  </div>
  <button type="button" class="fab-btn" id="fabMenuBtn" aria-label="メニュー">⋯</button>
</div>

<div class="fmt-bar" id="fmtBar">
  <button type="button" id="fmtBold" aria-label="太字"><b>B</b></button>
  <button type="button" id="fmtUnderline" aria-label="下線"><u>U</u></button>
</div>

<div class="bottombar">
  <button class="bigBtn" id="bigBtn">
    <span class="main" id="bigBtnMain">長文モード</span>
    <span class="sub" id="bigBtnSub">押しながらセルへドラッグして開く</span>
  </button>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2>テキストとして書き出し</h2>
    <textarea class="export-area" id="exportArea" readonly></textarea>
    <div class="modal-actions">
      <button id="copyBtn">コピー</button>
      <button class="primary" id="closeModalBtn">閉じる</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="styleOverlay">
  <div class="modal">
    <h2>文字スタイル</h2>
    <div class="style-form">
      <div class="style-row">
        <label for="fontSizeSelect">基本サイズ</label>
        <select id="fontSizeSelect">
          <option value="12">12</option>
          <option value="14">14</option>
          <option value="16" selected>16</option>
          <option value="18">18</option>
          <option value="20">20</option>
          <option value="22">22</option>
          <option value="24">24</option>
          <option value="28">28</option>
          <option value="32">32</option>
          <option value="36">36</option>
        </select>
      </div>
      <div class="style-row">
        <label for="fontFamilySelect">フォント</label>
        <select id="fontFamilySelect">
          <option value="gothic" selected>ゴシック（Zen Kaku）</option>
          <option value="mincho">明朝（Shippori）</option>
          <option value="system">システム</option>
        </select>
      </div>
      <div class="style-preview" id="stylePreview">あいうえお ABC 123</div>
    </div>
    <div class="modal-actions">
      <button id="closeStyleBtn" class="primary">閉じる</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="pasteOverlay">
  <div class="modal">
    <h2>アウトラインを取り込む</h2>
    <p class="paste-hint" id="pasteHint">先頭の無印行→選択中セル。続く - リスト→周辺セル（インデントの相対関係だけで階層判定）。</p>
    <textarea class="paste-area" id="pasteArea" placeholder="8月12日(水)&#10;- やること&#10;  - 子1&#10;  - 子2&#10;- 朝"></textarea>
    <div class="modal-actions">
      <button id="cancelPasteBtn">キャンセル</button>
      <button class="primary" id="runPasteBtn">取り込む</button>
    </div>
  </div>
</div>

<script>
(function(){
  const STORAGE_KEY = 'mandalart:state';
  const STYLE_KEY = 'mandalart:style';

  const FONT_FAMILIES = {
    gothic: '"Zen Kaku Gothic New", -apple-system, BlinkMacSystemFont, sans-serif',
    mincho: '"Shippori Mincho", "Hiragino Mincho ProN", serif',
    system: '-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif'
  };

  let styleSettings = { size: 16, family: 'gothic' };

  function applyStyleSettings(){
    const rootStyle = document.documentElement.style;
    rootStyle.setProperty('--cell-font-size', styleSettings.size + 'px');
    rootStyle.setProperty('--cell-font-family', FONT_FAMILIES[styleSettings.family] || FONT_FAMILIES.gothic);
    const sizeSelect = document.getElementById('fontSizeSelect');
    const familySelect = document.getElementById('fontFamilySelect');
    if (sizeSelect) sizeSelect.value = String(styleSettings.size);
    if (familySelect) familySelect.value = styleSettings.family;
  }

  function saveStyleSettings(){
    try{ localStorage.setItem(STYLE_KEY, JSON.stringify(styleSettings)); }catch(e){}
  }

  function loadStyleSettings(){
    try{
      const raw = localStorage.getItem(STYLE_KEY);
      if (raw){
        const parsed = JSON.parse(raw);
        const size = Number(parsed && parsed.size);
        const family = parsed && parsed.family;
        if ([12,14,16,18,20,22,24,28,32,36].includes(size)) styleSettings.size = size;
        if (FONT_FAMILIES[family]) styleSettings.family = family;
      }
    }catch(e){}
    applyStyleSettings();
  }

  // Each node is one 3x3 board (9 cells, index 4 = center). Non-center cells can be
  // expanded into a child node (created lazily), which itself can be expanded further,
  // to any depth. The child's center cell always mirrors the parent's cell that opened it.
  function makeNode(){
    return { cells: Array(9).fill(''), children: new Array(9).fill(null) };
  }
  let root = makeNode();
  // navPath: [{node, idx}] from root (idx=null) down to the node currently on screen.
  let navPath = [{ node: root, idx: null }];

  function currentNode(){ return navPath[navPath.length - 1].node; }
  function atRoot(){ return navPath.length === 1; }

  const boardEl = document.getElementById('board');
  const titleEl = document.getElementById('titleEl');
  const backBtn = document.getElementById('backBtn');
  const menuBtn = document.getElementById('menuBtn');
  const menu = document.getElementById('menu');
  const longtextEl = document.getElementById('longtext');
  const ltLabel = document.getElementById('ltLabel');
  const ltArea = document.getElementById('ltArea');
  const bigBtn = document.getElementById('bigBtn');
  const bigBtnMain = document.getElementById('bigBtnMain');
  const bigBtnSub = document.getElementById('bigBtnSub');
  const fmtBar = document.getElementById('fmtBar');
  let longTextTarget = null; // { c } or null
  let lastFocusedCellC = null; // last cell the user focused for outline import
  let importTargetC = null; // locked when paste modal opens
  let lastPasteText = ''; // remember last imported outline for easy re-paste

  // ---- rich text helpers (cells store HTML; plain text still works) ----
  const ALLOWED_TAGS = /^(B|STRONG|U|BR|DIV|SPAN|P)$/i;
  function plainText(html){
    if (!html) return '';
    const d = document.createElement('div');
    d.innerHTML = html;
    return (d.innerText || d.textContent || '').replace(/\u00a0/g, ' ');
  }
  function looksLikeHtml(s){
    return /<[a-z][\s\S]*>/i.test(s || '');
  }
  function sanitizeHtml(html){
    const d = document.createElement('div');
    d.innerHTML = html || '';
    (function walk(node){
      const kids = Array.from(node.childNodes);
      kids.forEach((child) => {
        if (child.nodeType !== 1) return;
        const tag = child.tagName.toUpperCase();
        if (tag === 'SPAN'){
          const style = (child.getAttribute('style') || '').toLowerCase();
          const bold = /font-weight\s*:\s*(bold|[6-9]00)/.test(style);
          const under = /text-decoration[^;]*underline/.test(style);
          let replacement = null;
          if (bold && under){
            replacement = document.createElement('b');
            const u = document.createElement('u');
            while (child.firstChild) u.appendChild(child.firstChild);
            replacement.appendChild(u);
          } else if (bold){
            replacement = document.createElement('b');
            while (child.firstChild) replacement.appendChild(child.firstChild);
          } else if (under){
            replacement = document.createElement('u');
            while (child.firstChild) replacement.appendChild(child.firstChild);
          }
          if (replacement){
            node.replaceChild(replacement, child);
            walk(replacement);
            return;
          }
        }
        if (!ALLOWED_TAGS.test(child.tagName)){
          while (child.firstChild) node.insertBefore(child.firstChild, child);
          node.removeChild(child);
        } else {
          while (child.attributes.length) child.removeAttribute(child.attributes[0].name);
          walk(child);
        }
      });
    })(d);
    return d.innerHTML;
  }
  function setEditorContent(el, raw){
    if (!raw){ el.innerHTML = ''; return; }
    if (looksLikeHtml(raw)) el.innerHTML = sanitizeHtml(raw);
    else el.textContent = raw;
  }
  function getEditorContent(el){
    const text = plainText(el.innerHTML).trim();
    if (!text) return '';
    return sanitizeHtml(el.innerHTML);
  }
  function htmlToMarkdownInline(html){
    const d = document.createElement('div');
    d.innerHTML = sanitizeHtml(html || '');
    function walk(node){
      let out = '';
      node.childNodes.forEach((child) => {
        if (child.nodeType === 3){
          out += child.nodeValue;
        } else if (child.nodeType === 1){
          const tag = child.tagName.toUpperCase();
          const inner = walk(child);
          if (tag === 'B' || tag === 'STRONG') out += '**' + inner + '**';
          else if (tag === 'U') out += '<u>' + inner + '</u>';
          else if (tag === 'BR') out += '\n';
          else if (tag === 'DIV' || tag === 'P') out += (out && !out.endsWith('\n') ? '\n' : '') + inner;
          else out += inner;
        }
      });
      return out;
    }
    return walk(d).replace(/\n+$/, '');

  // ---- selection format bar ----

    const el = node.nodeType === 1 ? node : node.parentElement;

  function canExpand(c){

  function expand(c){
    if (c === 4){
      if (atRoot()) return;
      navPath.pop();
    } else {
      const node = currentNode();
      if (!node.children[c]) node.children[c] = makeNode();

  const LONG_PRESS_MS = 320;

  function attachGestures(cellEl, ta, c){

    cellEl.addEventListener('pointercancel', onCancel);

    ta.addEventListener('pointerup', onUp);
    ta.addEventListener('pointercancel', onCancel);

  function normalizeNode(raw){
    const node = makeNode();

  // visual ring order matching the diagram's numbering: bottom-mid, bottom-left, mid-left,
  // top-left, top-mid, top-right, mid-right, bottom-right (starts at 6 o'clock, sweeps around)
  const RING_ORDER = [7, 6, 3, 0, 1, 2, 5, 8];

  function cellRoleLabel(c){
    if (c === 4) return atRoot() ? '中心ゴール' : 'この階層の中心';

  // ---- outline import (Workflowy-style nested "- " lists) ----
  function cleanOutlineText(s){
    return String(s || '')
      .replace(/\*\*(.*?)\*\*/g, '$1')
      .replace(/__(.*?)__/g, '$1')
      .replace(/<\/?u>/gi, '')
      .replace(/<[^>]+>/g, '')
      .replace(/\u00a0/g, ' ')
      .trim();
  }

  function parseOutlineText(text){
    const lines = String(text || '').split(/\r?\n/);
    const items = [];
    let title = null;
    let seenBullet = false;
    for (const raw of lines){
      if (!raw.trim()) continue;
      const m = raw.match(/^([ \t]*)([-*•]|\d+[.)])\s+(.*)$/);
      if (m){
        seenBullet = true;
        const indent = m[1].replace(/\t/g, '  ').length;
        items.push({ indent, text: cleanOutlineText(m[3]) });
        continue;
      }
      // Workflowy export: first non-bullet line before any bullets = selected-cell title
      if (!seenBullet && title === null){
        title = cleanOutlineText(raw);
      }
    }

    if (!items.length && title === null) return { title: null, forest: [] };

    // depth from relative indent ranks only (ignore absolute whitespace size)
    let forest = [];
    if (items.length){
      const indents = [...new Set(items.map((it) => it.indent))].sort((a, b) => a - b);
      const depthOf = new Map(indents.map((ind, i) => [ind, i]));
      items.forEach((it) => { it.depth = depthOf.get(it.indent); });

      const stack = [{ depth: -1, children: forest }];
      items.forEach((it) => {
        while (stack.length && stack[stack.length - 1].depth >= it.depth) stack.pop();
        const parent = stack[stack.length - 1];
        const node = { text: it.text, children: [] };
        parent.children.push(node);
        stack.push({ depth: it.depth, children: node.children, node });
      });
    }
    return { title, forest };
  }

  function findOverfullNodes(nodes, path){
    const hits = [];
    (nodes || []).forEach((n, i) => {
      const label = n.text || `(無題${i + 1})`;
      const here = path ? path + ' > ' + label : label;
      if ((n.children || []).length > 8) hits.push({ path: here, count: n.children.length });
      hits.push(...findOverfullNodes(n.children, here));
    });
    return hits;
  }

  function boardFromOutlineChildren(centerText, children){
    const board = makeNode();
    board.cells[4] = centerText || '';
    (children || []).slice(0, 8).forEach((kid, i) => {
      const idx = RING_ORDER[i];
      board.cells[idx] = kid.text || '';
      if (kid.children && kid.children.length){
        board.children[idx] = boardFromOutlineChildren(kid.text || '', kid.children);
      }
    });
    return board;
  }

  function clearOuterCells(node){

  function applyOutlineToFocusedCell(cellC, parsed){
    const forest = Array.isArray(parsed) ? parsed : (parsed && parsed.forest) || [];
    const title = Array.isArray(parsed) ? null : (parsed && parsed.title);
    if (!forest.length && (title === null || title === undefined || title === '')){
      throw new Error('アウトライン形式の行が見つかりません（先頭行＋ "- 項目" の形で貼ってください）');
    }

    const treeForCheck = (title !== null && title !== undefined)
      ? [{ text: title || '(選択セル)', children: forest }]
      : forest;
    const overfull = findOverfullNodes(treeForCheck, '');
    if (forest.length > 8){
      overfull.unshift({ path: title || '(選択セル)', count: forest.length });
    }
    if (overfull.length){
      const sample = overfull.slice(0, 3).map((h) => `・${h.path}（${h.count}個）`).join('\n');
      const more = overfull.length > 3 ? `\n…ほか${overfull.length - 3}件` : '';
      const ok = confirm(
        `子階層が8つを超える項目があります。先頭の8つだけ取り込みます。\n\n${sample}${more}\n\n続けますか？`

      if (!ok) return false;
    }

    let rootOutline;
    if (title !== null && title !== undefined){
      // Workflowy: title line -> selected cell, following bullets -> surrounding/children
      rootOutline = { text: title, children: forest };
    } else if (forest.length === 1){
      rootOutline = forest[0];
    } else {
      // multiple top-level bullets become children of the focused cell
      rootOutline = {
        text: cellDisplay(currentNode().cells[cellC]),
        children: forest
      };
    }

    const node = currentNode();
    const centerText = rootOutline.text || '';
    node.cells[cellC] = centerText;

    if (cellC === 4){
      // center cell: children fill this board's outer ring
      clearOuterCells(node);
      (rootOutline.children || []).slice(0, 8).forEach((kid, i) => {
        const idx = RING_ORDER[i];
        node.cells[idx] = kid.text || '';
        node.children[idx] = (kid.children && kid.children.length)
          ? boardFromOutlineChildren(kid.text || '', kid.children)
          : null;
      });
    } else {
      // non-center: children live in a nested board under this cell
      node.children[cellC] = (rootOutline.children && rootOutline.children.length)
        ? boardFromOutlineChildren(centerText, rootOutline.children)
        : null;
    }

    syncMirror(cellC);
    return true;
  }

  function targetCellForImport(){
    captureFocusedCell();

    return null;
  }

  const pasteOverlay = document.getElementById('pasteOverlay');

  async function openPasteModal(){

  function runOutlineImport(){
    const c = (typeof importTargetC === 'number') ? importTargetC : targetCellForImport();
    if (c === null){
      alert('取り込み先のセルが不明です。セルを選択し直してください。');
      return;
    }
    const raw = pasteArea.value;
    let parsed;
    try{
      parsed = parseOutlineText(raw);
    }catch(e){
      alert(e.message || '解析に失敗しました');
      return;
    }
    if ((!parsed.forest || !parsed.forest.length) && !parsed.title){
      alert('アウトライン形式の行が見つかりません。\n例:\n8月12日\n- やること\n  - 子1');
      return;
    }

    const node = currentNode();
    const hasExisting = !!(
      cellDisplay(node.cells[c]) ||
      (c === 4 && RING_ORDER.some((idx) => cellDisplay(node.cells[idx]) || node.children[idx])) ||
      (c !== 4 && node.children[c])
    );
    if (hasExisting){
      if (!confirm('選択中のセル（とその下の階層）の内容を上書きします。よろしいですか？')) return;
    }

    try{
      const ok = applyOutlineToFocusedCell(c, parsed);
      if (!ok) return;
    }catch(e){
      alert(e.message || '取り込みに失敗しました');
      return;
    }

    lastPasteText = raw;
    lastFocusedCellC = c;
    importTargetC = c;

    if (longTextTarget && longTextTarget.c === c){
      setEditorContent(ltArea, currentNode().cells[c]);
    }
    closePasteModal();
    render();
    scheduleSave();
  }

  function buildExportText(){
    let out = '=== マンダラート ===\n\n';
    out += `中心ゴール: ${cellDisplay(root.cells[4]) || '(未入力)'}\n\n`;
    function renderDetails(node, depth){
      let s = '';
      RING_ORDER.forEach((idx) => {
        const val = cellDisplay(node.cells[idx]);
        if (val) s += '  '.repeat(depth) + `・${val}\n`;
        if (node.children[idx]) s += renderDetails(node.children[idx], depth + 1);
      });
      return s;
    }
    RING_ORDER.forEach((themeIdx, i) => {
      const theme = cellDisplay(root.cells[themeIdx]) || `(未入力)`;
      out += `◆ テーマ${i + 1}: ${theme}\n`;
      if (root.children[themeIdx]) out += renderDetails(root.children[themeIdx], 1);
      out += '\n';
    });
    return out;
  }

  function buildMarkdownText(){
    let out = `# ${htmlToMarkdownInline(root.cells[4]) || '目標'}\n\n`;
    function renderDetails(node, indent){
      let s = '';
      RING_ORDER.forEach((idx) => {
        const val = htmlToMarkdownInline(node.cells[idx]);
        if (val) s += '  '.repeat(indent) + `- ${val}\n`;
        if (node.children[idx]) s += renderDetails(node.children[idx], indent + 1);
      });
      return s;
    }
    RING_ORDER.forEach((themeIdx, i) => {
      const theme = htmlToMarkdownInline(root.cells[themeIdx]) || `テーマ ${i + 1}`;
      out += `## ${theme}\n`;
      if (root.children[themeIdx]) out += renderDetails(root.children[themeIdx], 0);
      out += '\n';
    });
    return out;
  }

  function buildWorkflowyText(){
    const goal = cellDisplay(root.cells[4]);
    let out = `- ${goal || '目標'}\n`;
    function renderDetails(node, depth){
      let s = '';
      RING_ORDER.forEach((idx) => {
        const val = cellDisplay(node.cells[idx]);
        const child = node.children[idx];
        if (!val && !child) return;
        s += '  '.repeat(depth) + `- ${val}\n`;
        if (child) s += renderDetails(child, depth + 1);
      });
      return s;
    }
    RING_ORDER.forEach((themeIdx, i) => {
      const theme = cellDisplay(root.cells[themeIdx]);
      const child = root.children[themeIdx];
      const childLines = child ? renderDetails(child, 2) : '';
      if (!theme && !childLines) return;
      out += `  - ${theme || `テーマ ${i + 1}`}\n`;
      out += childLines;
    });
    return out;
  }

  document.getElementById('exportBtn').addEventListener('pointerup', () => {
    closeMenu();
    exportArea.value = buildExportText();
    overlay.classList.add('open');
  });
  document.getElementById('exportMdBtn').addEventListener('pointerup', () => {
    closeMenu();
    exportArea.value = buildMarkdownText();
    overlay.classList.add('open');
  });
  document.getElementById('exportWfBtn').addEventListener('pointerup', () => {
    closeMenu();
    exportArea.value = buildWorkflowyText();
    overlay.classList.add('open');
  });
  document.getElementById('importOutlineBtn').addEventListener('pointerup', () => {
    openPasteModal();
  });
  document.getElementById('runPasteBtn').addEventListener('pointerup', () => runOutlineImport());
  document.getElementById('cancelPasteBtn').addEventListener('pointerup', () => closePasteModal());
  pasteOverlay.addEventListener('pointerup', (e) => { if (e.target === pasteOverlay) closePasteModal(); });
  document.getElementById('closeModalBtn').addEventListener('pointerup', () => overlay.classList.remove('open'));
  overlay.addEventListener('pointerup', (e) => { if (e.target === overlay) overlay.classList.remove('open'); });

  const styleOverlay = document.getElementById('styleOverlay');
  document.getElementById('styleBtn').addEventListener('pointerup', () => {
    closeMenu();
    applyStyleSettings();
    styleOverlay.classList.add('open');
  });
  document.getElementById('closeStyleBtn').addEventListener('pointerup', () => styleOverlay.classList.remove('open'));
  styleOverlay.addEventListener('pointerup', (e) => { if (e.target === styleOverlay) styleOverlay.classList.remove('open'); });
  document.getElementById('fontSizeSelect').addEventListener('change', (e) => {
    styleSettings.size = Number(e.target.value) || 16;
    applyStyleSettings();
    saveStyleSettings();
  });
  document.getElementById('fontFamilySelect').addEventListener('change', (e) => {
    styleSettings.family = FONT_FAMILIES[e.target.value] ? e.target.value : 'gothic';
    applyStyleSettings();
    saveStyleSettings();
  });

  document.getElementById('copyBtn').addEventListener('pointerup', async () => {
    try{
      await navigator.clipboard.writeText(exportArea.value);
      document.getElementById('copyBtn').textContent = 'コピーしました';
    }catch(e){
      exportArea.select();
      document.execCommand && document.execCommand('copy');
      document.getElementById('copyBtn').textContent = '選択済み（手動でコピー）';
    }
    setTimeout(() => { document.getElementById('copyBtn').textContent = 'コピー'; }, 1500);
  });
  document.getElementById('resetBtn').addEventListener('pointerup', () => {
    closeMenu();
    if (!confirm('すべての内容をクリアします。よろしいですか？')) return;
    root = makeNode();
    navPath = [{ node: root, idx: null }];
    render();
    try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  });

  // ---- long-text focused writing mode ----
  function cellLabel(c){
    const node = currentNode();
    if (atRoot() && c === 4) return '中心ゴール';
    if (atRoot()) return cellDisplay(node.cells[c]) || `テーマ ${c + 1}`;
    if (c === 4) return cellDisplay(node.cells[4]) || 'テーマに戻る';
    return `詳細 ${c + 1}`;
  }

  function openLongText(c){
    if (document.activeElement) document.activeElement.blur();
    longTextTarget = { c: c };
    lastFocusedCellC = c;
    setEditorContent(ltArea, currentNode().cells[c]);
    ltLabel.textContent = cellLabel(c);
    boardEl.style.display = 'none';
    longtextEl.classList.add('show');
    bigBtnMain.textContent = 'グリッドに戻る';
    bigBtnSub.textContent = 'このボタンを押すと戻ります';
    bigBtn.classList.add('mode-close');
    ltArea.focus();
  }

  function closeLongText(){
    if (longTextTarget){
      currentNode().cells[longTextTarget.c] = getEditorContent(ltArea);
      syncMirror(longTextTarget.c);
      longTextTarget = null;
      scheduleSave();
    }
    hideFmtBar();
    longtextEl.classList.remove('show');
    boardEl.style.display = '';
    bigBtnMain.textContent = '長文モード';
    bigBtnSub.textContent = '押しながらセルへドラッグして開く';
    bigBtn.classList.remove('mode-close');
    render();
  }

  ltArea.addEventListener('input', () => {
    if (!longTextTarget) return;
    currentNode().cells[longTextTarget.c] = getEditorContent(ltArea);
    syncMirror(longTextTarget.c);
    scheduleSave();
  });

  let bigButtonHeld = false, heldPointerId = null, bigHoverCell = null;
  bigBtn.addEventListener('pointerdown', (e) => {
    bigButtonHeld = true;
    heldPointerId = e.pointerId;
    bigBtn.classList.add('pressed');
  });
  document.addEventListener('pointermove', (e) => {
    if (!bigButtonHeld || e.pointerId !== heldPointerId || longTextTarget) return;
    if (bigHoverCell){ bigHoverCell.classList.remove('dropTarget'); bigHoverCell = null; }
    const under = document.elementFromPoint(e.clientX, e.clientY);
    const cand = under ? under.closest('.cell') : null;
    if (cand && boardEl.contains(cand)){ cand.classList.add('dropTarget'); bigHoverCell = cand; }
  });
  document.addEventListener('pointerup', (e) => {
    if (e.pointerId !== heldPointerId) return;
    const wasHeld = bigButtonHeld;
    bigButtonHeld = false; heldPointerId = null;
    bigBtn.classList.remove('pressed');
    if (bigHoverCell){ bigHoverCell.classList.remove('dropTarget'); bigHoverCell = null; }
    if (!wasHeld) return;

    // iOS keeps touch events targeted at the element pointerdown started on, regardless of
    // where the finger is at release, so find the real element under the finger ourselves.
    const under = document.elementFromPoint(e.clientX, e.clientY);
    const onButton = !!(under && (under === bigBtn || bigBtn.contains(under)));
    const cellEl = under ? under.closest('.cell') : null;

    if (longTextTarget){
      if (onButton) closeLongText();
      return;
    }
    if (cellEl && boardEl.contains(cellEl)){
      openLongText(Number(cellEl.dataset.c));
    }
  });
  document.addEventListener('pointercancel', (e) => {
    if (e.pointerId === heldPointerId){
      bigButtonHeld = false; heldPointerId = null;
      bigBtn.classList.remove('pressed');
      if (bigHoverCell){ bigHoverCell.classList.remove('dropTarget'); bigHoverCell = null; }
    }
  });

  document.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.fmt-bar')) return;
    const active = document.activeElement;
    if (active && active.classList && active.classList.contains('cell-editor') && boardEl.contains(active) && !e.target.closest('.cell')){
      active.blur();
      hideFmtBar();
    }
  });

  loadStyleSettings();
  loadData();
  function sizeBoard(){
    const stage = document.querySelector('.stage');
    if (!stage) return;
    const size = Math.max(0, Math.min(stage.clientWidth, stage.clientHeight));
    boardEl.style.width = size + 'px';
    boardEl.style.height = size + 'px';
  }
  window.addEventListener('resize', sizeBoard);
  window.addEventListener('orientationchange', sizeBoard);
  sizeBoard();
  // layout can shift slightly after the first paint (fonts, safe-area insets settling),
  // so re-measure a couple of times shortly after load to make sure the square is accurate
  requestAnimationFrame(() => requestAnimationFrame(sizeBoard));
  setTimeout(sizeBoard, 300);
})();
</script>
</body>
</html>
