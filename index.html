<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="マンダラート">
<title>マンダラート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --ink:#1c1c1a;
    --ink-soft:#8a8a86;
    --cell-bg:#ffffff;
    --cell-border:#dcdcdc;
    --cell-border-w:1px;
    --center-border:#151515;
    --center-border-w:3px;
    --radius:10px;
    --accent:#B23A2E;
    --gap: clamp(10px, 3.2vw, 18px);
    --topbar-h: 54px;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html,body{ height:100%; overscroll-behavior:none; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Zen Kaku Gothic New", -apple-system, BlinkMacSystemFont, sans-serif;
    display:flex;
    flex-direction:column;
    position:fixed;
    inset:0;
    height:100dvh;
    height:100vh;
    overflow:hidden;
  }

  /* top bar */
  .topbar{
    height:var(--topbar-h);
    flex:0 0 var(--topbar-h);
    display:flex;
    align-items:center;
    padding: env(safe-area-inset-top) 6px 0;
    padding-top:max(6px, env(safe-area-inset-top));
    border-bottom:1px solid #eee;
  }
  .backBtn{
    width:40px; height:40px; border:0; background:none; font-size:22px;
    color:var(--ink); display:flex; align-items:center; justify-content:center;
    visibility:hidden; cursor:pointer;
  }
  .backBtn.show{ visibility:visible; }
  .title{
    flex:1; text-align:center; font-family:"Shippori Mincho", serif;
    font-weight:700; font-size:15px; letter-spacing:.03em;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:0 4px;
  }
  .menuWrap{ position:relative; }
  .menuBtn{
    width:40px; height:40px; border:0; background:none; font-size:20px;
    color:var(--ink); cursor:pointer;
  }
  .menu{
    position:absolute; top:44px; right:4px; background:#fff; border:1px solid #e2e2e2;
    border-radius:8px; box-shadow:0 6px 20px rgba(0,0,0,.12); overflow:hidden;
    display:none; min-width:150px; z-index:20;
  }
  .menu.open{ display:block; }
  .menu button{
    display:block; width:100%; text-align:left; padding:11px 14px; border:0; background:none;
    font-family:inherit; font-size:13.5px; color:var(--ink); cursor:pointer;
  }
  .menu button:active{ background:#f3f1ea; }
  .menu button + button{ border-top:1px solid #eee; }

  /* board area */
  .stage{
    flex:1; display:flex; align-items:center; justify-content:center;
    padding:14px; min-height:0;
  }
  .board{
    width:100%; height:100%;
    max-width:100%; max-height:100%;
    aspect-ratio:1/1;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);
    gap:var(--gap);
    position:relative;
  }
  .cell{
    background:var(--cell-bg);
    border:var(--cell-border-w) solid var(--cell-border);
    border-radius:var(--radius);
    position:relative;
    touch-action:none;
    transition:box-shadow .15s ease, border-color .12s ease;
  }
  .cell.dragging{ transition:none; }
  .cell.center{
    border:var(--center-border-w) solid var(--center-border);
  }
  .cell.dragging{
    z-index:5;
    box-shadow:0 10px 24px rgba(0,0,0,.18);
    transform:scale(1.04);
  }
  .cell.dropTarget{
    border-color:var(--accent);
    box-shadow: inset 0 0 0 2px var(--accent);
  }
  textarea{
    width:100%; height:100%;
    border:0; resize:none; background:transparent;
    font-family:inherit; color:var(--ink);
    font-size: clamp(11px, 3vw, 14px);
    line-height:1.3;
    padding:6px;
    text-align:center;
    outline:none;
    display:flex; align-items:center;
    user-select:text; -webkit-user-select:text;
  }
  .cell textarea{ pointer-events:none; }
  .cell.center textarea{ font-weight:700; }

  /* export modal */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(20,20,18,0.5);
    display:none; align-items:center; justify-content:center; padding:20px; z-index:30;
  }
  .modal-overlay.open{ display:flex; }
  .modal{
    background:#fff; border-radius:10px; padding:16px; width:100%; max-width:480px;
    max-height:78vh; display:flex; flex-direction:column; gap:10px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
  }
  .modal h2{ font-family:"Shippori Mincho",serif; font-size:16px; margin:0; }
  .modal textarea.export-area{
    width:100%; flex:1; min-height:260px; font-size:12.5px; padding:10px;
    border:1px solid #ddd; border-radius:6px; text-align:left;
    color:var(--ink); resize:vertical; user-select:text; -webkit-user-select:text;
  }
  .modal-actions{ display:flex; gap:8px; justify-content:flex-end; }
  .modal-actions button{
    font-family:inherit; font-size:13px; padding:9px 14px; border-radius:6px;
    border:1px solid #ddd; background:#fff; cursor:pointer;
  }
  .modal-actions button.primary{ background:var(--ink); color:#fff; border-color:var(--ink); }

  /* bottom bar / big button */
  .bottombar{
    flex:0 0 auto;
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
  }
  .bigBtn{
    width:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px;
    padding:12px 10px;
    border:0; border-radius:14px;
    background:#2b2b28;
    color:#fff;
    font-family:inherit;
    cursor:pointer;
    touch-action:none;
    transition:background .12s ease, transform .1s ease;
  }
  .bigBtn .main{ font-size:14px; font-weight:700; letter-spacing:.02em; }
  .bigBtn .sub{ font-size:10.5px; opacity:.75; }
  .bigBtn.pressed{ background:var(--accent); transform:scale(0.99); }
  .bigBtn.mode-close{ background:var(--accent); }

  /* long-text focused writing view */
  .longtext{
    display:none;
    flex-direction:column;
    width:100%; height:100%;
  }
  .longtext.show{ display:flex; }
  .longtext .lt-label{
    font-family:"Shippori Mincho", serif;
    font-weight:700;
    font-size:14px;
    color:var(--ink-soft);
    text-align:center;
    padding-bottom:10px;
  }
  .longtext textarea{
    flex:1;
    width:100%;
    border:0;
    resize:none;
    background:transparent;
    font-family:inherit;
    color:var(--ink);
    font-size:16px;
    line-height:1.7;
    padding:4px 2px;
    text-align:left;
    outline:none;
    display:block;
    user-select:text; -webkit-user-select:text;
  }
</style>
</head>
<body>

<div class="topbar">
  <button class="backBtn" id="backBtn" aria-label="戻る">‹</button>
  <div class="title" id="titleEl">マンダラート</div>
  <div class="menuWrap">
    <button class="menuBtn" id="menuBtn" aria-label="メニュー">⋯</button>
    <div class="menu" id="menu">
      <button id="exportBtn">書き出す（テキスト）</button>
      <button id="exportMdBtn">書き出す（Markdown）</button>
      <button id="resetBtn">クリア</button>
    </div>
  </div>
</div>

<div class="stage">
  <div class="board" id="board"></div>
  <div class="longtext" id="longtext">
    <div class="lt-label" id="ltLabel"></div>
    <textarea id="ltArea" placeholder="ここに自由に書けます"></textarea>
  </div>
</div>

<div class="bottombar">
  <button class="bigBtn" id="bigBtn">
    <span class="main" id="bigBtnMain">長文モード</span>
    <span class="sub" id="bigBtnSub">押しながらセルへドラッグして開く</span>
  </button>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2>テキストとして書き出し</h2>
    <textarea class="export-area" id="exportArea" readonly></textarea>
    <div class="modal-actions">
      <button id="copyBtn">コピー</button>
      <button class="primary" id="closeModalBtn">閉じる</button>
    </div>
  </div>
</div>

<script>
(function(){
  const STORAGE_KEY = 'mandalart:state';
  const mirrorIdx = [0,1,2,3,5,6,7,8];
  let grid = Array.from({length:9}, () => Array(9).fill(''));
  let currentBlock = 4;

  const boardEl = document.getElementById('board');
  const titleEl = document.getElementById('titleEl');
  const backBtn = document.getElementById('backBtn');
  const menuBtn = document.getElementById('menuBtn');
  const menu = document.getElementById('menu');
  const longtextEl = document.getElementById('longtext');
  const ltLabel = document.getElementById('ltLabel');
  const ltArea = document.getElementById('ltArea');
  const bigBtn = document.getElementById('bigBtn');
  const bigBtnMain = document.getElementById('bigBtnMain');
  const bigBtnSub = document.getElementById('bigBtnSub');
  let longTextTarget = null; // { block, c } or null

  function syncMirror(block, cellIdx){
    if (block === 4 && cellIdx !== 4){
      grid[cellIdx][4] = grid[4][cellIdx];
    } else if (block !== 4 && cellIdx === 4){
      grid[4][block] = grid[block][4];
    }
  }

  function render(){
    // title / back button
    if (currentBlock === 4){
      backBtn.classList.remove('show');
      titleEl.textContent = grid[4][4] ? grid[4][4] : 'マンダラート';
    } else {
      backBtn.classList.add('show');
      titleEl.textContent = grid[4][currentBlock] ? grid[4][currentBlock] : 'テーマ ' + (currentBlock + 1);
    }

    boardEl.innerHTML = '';
    for (let c = 0; c < 9; c++){
      const cellEl = document.createElement('div');
      cellEl.className = 'cell' + (c === 4 ? ' center' : '');
      cellEl.dataset.c = c;

      const ta = document.createElement('textarea');
      ta.value = grid[currentBlock][c];
      ta.setAttribute('placeholder', (currentBlock === 4 && c === 4) ? '目標' : '');
      ta.addEventListener('input', () => {
        grid[currentBlock][c] = ta.value;
        syncMirror(currentBlock, c);
        if (currentBlock === 4 && c === 4){ titleEl.textContent = ta.value || 'マンダラート'; }
        if (currentBlock !== 4 && c === 4){ /* affects root title only, not shown now */ }
        scheduleSave();
      });
      cellEl.appendChild(ta);
      boardEl.appendChild(cellEl);
      attachGestures(cellEl, ta, c);
    }
  }

  function canExpand(c){
    return (currentBlock === 4 && c !== 4) || (currentBlock !== 4 && c === 4);
  }

  function expand(c){
    if (currentBlock === 4 && c !== 4){
      currentBlock = c;
    } else if (currentBlock !== 4 && c === 4){
      currentBlock = 4;
    } else {
      return;
    }
    if (document.activeElement) document.activeElement.blur();
    render();
    scheduleSave();
  }

  backBtn.addEventListener('click', () => { currentBlock = 4; render(); scheduleSave(); });

  // ---- gestures: tap-to-edit, long-press+drag to swap, double-tap to expand ----
  const LONG_PRESS_MS = 380;
  const DOUBLE_TAP_MS = 300;
  const MOVE_CANCEL_PX = 28; // generous, so natural finger jitter never breaks a long-press

  let lastTap = { c:null, time:0 };
  let longPressTimer = null;
  let isDragging = false;
  let dragCell = null, dragTa = null, dragC = null;
  let startX = 0, startY = 0;
  let dropTargetEl = null;

  function attachGestures(cellEl, ta, c){
    ta.style.pointerEvents = 'none'; // all taps are handled by the wrapper; focus() still works without this

    cellEl.addEventListener('pointerdown', (e) => {
      startX = e.clientX; startY = e.clientY;
      const wasEditingThisCell = (document.activeElement === ta);
      clearTimeout(longPressTimer);
      longPressTimer = setTimeout(() => {
        isDragging = true;
        dragCell = cellEl; dragTa = ta; dragC = c;
        if (wasEditingThisCell) ta.blur();
        cellEl.classList.add('dragging');
        cellEl.style.pointerEvents = 'none'; // so elementFromPoint sees the cell underneath, not this one
        try{ cellEl.setPointerCapture(e.pointerId); }catch(err){}
      }, LONG_PRESS_MS);
      cellEl.dataset.wasEditing = wasEditingThisCell ? '1' : '0';
    });

    cellEl.addEventListener('pointermove', (e) => {
      if (!isDragging){
        const dx = Math.abs(e.clientX - startX), dy = Math.abs(e.clientY - startY);
        if (dx > MOVE_CANCEL_PX || dy > MOVE_CANCEL_PX) clearTimeout(longPressTimer);
        return;
      }
      const dx = e.clientX - startX, dy = e.clientY - startY;
      dragCell.style.transform = `translate(${dx}px, ${dy}px) scale(1.04)`;

      if (dropTargetEl){ dropTargetEl.classList.remove('dropTarget'); dropTargetEl = null; }
      const under = document.elementFromPoint(e.clientX, e.clientY);
      const cand = under ? under.closest('.cell') : null;
      if (cand && cand !== dragCell && boardEl.contains(cand)){
        cand.classList.add('dropTarget');
        dropTargetEl = cand;
      }
    });

    function finishDrag(){
      isDragging = false;
      dragCell.style.transform = '';
      dragCell.classList.remove('dragging');
      dragCell.style.pointerEvents = '';
      if (dropTargetEl){
        const j = Number(dropTargetEl.dataset.c);
        const i = dragC;
        const tmp = grid[currentBlock][i];
        grid[currentBlock][i] = grid[currentBlock][j];
        grid[currentBlock][j] = tmp;
        syncMirror(currentBlock, i);
        syncMirror(currentBlock, j);
        dropTargetEl.classList.remove('dropTarget');
        dropTargetEl = null;
        render();
        scheduleSave();
      }
    }

    cellEl.addEventListener('pointerup', () => {
      clearTimeout(longPressTimer);
      if (bigButtonHeld){
        if (!longTextTarget) openLongText(c);
        return;
      }
      if (isDragging){ finishDrag(); return; }

      const now = Date.now();
      const isDoubleTap = (lastTap.c === c && (now - lastTap.time) < DOUBLE_TAP_MS);

      if (isDoubleTap){
        // a fast second tap always means "expand", even though the first tap of the
        // pair already focused this cell (needed so single-tap opens the keyboard on iOS)
        lastTap = { c:null, time:0 };
        if (canExpand(c)) expand(c); // expand() blurs any focused cell
        return;
      }

      const wasEditingThisCell = cellEl.dataset.wasEditing === '1';
      if (wasEditingThisCell){
        // a slow tap on the cell that's already being edited simply exits edit mode
        ta.blur();
        lastTap = { c:null, time:0 };
        return;
      }

      // fresh single tap -> focus immediately (iOS only opens the keyboard for focus()
      // called synchronously inside the gesture, never after a delay)
      lastTap = { c:c, time:now };
      ta.focus();
    });

    cellEl.addEventListener('pointercancel', () => {
      clearTimeout(longPressTimer);
      if (isDragging){
        isDragging = false;
        dragCell.style.transform = '';
        dragCell.classList.remove('dragging');
        dragCell.style.pointerEvents = '';
        if (dropTargetEl){ dropTargetEl.classList.remove('dropTarget'); dropTargetEl = null; }
      }
    });
  }

  // ---- persistence (browser localStorage: works on any normal hosted page) ----
  let saveTimer = null;
  function scheduleSave(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveData, 400);
  }
  function saveData(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ grid, currentBlock }));
    }catch(err){ console.error('save failed', err); }
  }
  function loadData(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw){
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.grid) && parsed.grid.length === 9){
          grid = parsed.grid;
          currentBlock = typeof parsed.currentBlock === 'number' ? parsed.currentBlock : 4;
        }
      }
    }catch(err){ /* fresh start */ }
    render();
  }

  // ---- menu / export / reset ----
  menuBtn.addEventListener('click', (e) => { e.stopPropagation(); menu.classList.toggle('open'); });
  document.addEventListener('click', () => menu.classList.remove('open'));

  const overlay = document.getElementById('modalOverlay');
  const exportArea = document.getElementById('exportArea');

  // visual ring order matching the diagram's numbering: bottom-mid, bottom-left, mid-left,
  // top-left, top-mid, top-right, mid-right, bottom-right (starts at 6 o'clock, sweeps around)
  const RING_ORDER = [7, 6, 3, 0, 1, 2, 5, 8];

  function buildExportText(){
    let out = '=== マンダラート ===\n\n';
    out += `中心ゴール: ${grid[4][4] || '(未入力)'}\n\n`;
    for (let i = 0; i < 9; i++){
      if (i === 4) continue;
      const theme = grid[4][i] || '(未入力)';
      out += `◆ テーマ: ${theme}\n`;
      const cells = grid[i];
      for (let c = 0; c < 9; c++){
        if (c === 4) continue;
        if (cells[c]) out += `  ・${cells[c]}\n`;
      }
      out += '\n';
    }
    return out;
  }

  function buildMarkdownText(){
    let out = `# ${grid[4][4] || '目標'}\n\n`;
    RING_ORDER.forEach((themeIdx, i) => {
      const theme = grid[4][themeIdx] || `テーマ ${i + 1}`;
      out += `## ${theme}\n`;
      RING_ORDER.forEach((detailIdx) => {
        const val = grid[themeIdx][detailIdx];
        if (val) out += `- ${val}\n`;
      });
      out += '\n';
    });
    return out;
  }

  document.getElementById('exportBtn').addEventListener('click', () => {
    menu.classList.remove('open');
    exportArea.value = buildExportText();
    overlay.classList.add('open');
  });
  document.getElementById('exportMdBtn').addEventListener('click', () => {
    menu.classList.remove('open');
    exportArea.value = buildMarkdownText();
    overlay.classList.add('open');
  });
  document.getElementById('closeModalBtn').addEventListener('click', () => overlay.classList.remove('open'));
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.classList.remove('open'); });
  document.getElementById('copyBtn').addEventListener('click', async () => {
    try{
      await navigator.clipboard.writeText(exportArea.value);
      document.getElementById('copyBtn').textContent = 'コピーしました';
    }catch(e){
      exportArea.select();
      document.execCommand && document.execCommand('copy');
      document.getElementById('copyBtn').textContent = '選択済み（手動でコピー）';
    }
    setTimeout(() => { document.getElementById('copyBtn').textContent = 'コピー'; }, 1500);
  });
  document.getElementById('resetBtn').addEventListener('click', () => {
    menu.classList.remove('open');
    if (!confirm('すべての内容をクリアします。よろしいですか？')) return;
    grid = Array.from({length:9}, () => Array(9).fill(''));
    currentBlock = 4;
    render();
    try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  });

  // ---- long-text focused writing mode ----
  function cellLabel(block, c){
    if (block === 4 && c === 4) return '中心ゴール';
    if (block === 4) return grid[4][c] ? grid[4][c] : `テーマ ${c + 1}`;
    if (c === 4) return grid[4][block] ? grid[4][block] : 'テーマに戻る';
    return `詳細 ${c + 1}`;
  }

  function openLongText(c){
    if (document.activeElement) document.activeElement.blur();
    longTextTarget = { block: currentBlock, c: c };
    ltArea.value = grid[currentBlock][c];
    ltLabel.textContent = cellLabel(currentBlock, c);
    boardEl.style.display = 'none';
    longtextEl.classList.add('show');
    bigBtnMain.textContent = 'グリッドに戻る';
    bigBtnSub.textContent = 'このボタンを押すと戻ります';
    bigBtn.classList.add('mode-close');
    ltArea.focus();
  }

  function closeLongText(){
    if (longTextTarget){
      grid[longTextTarget.block][longTextTarget.c] = ltArea.value;
      syncMirror(longTextTarget.block, longTextTarget.c);
      longTextTarget = null;
      scheduleSave();
    }
    longtextEl.classList.remove('show');
    boardEl.style.display = '';
    bigBtnMain.textContent = '長文モード';
    bigBtnSub.textContent = '押しながらセルへドラッグして開く';
    bigBtn.classList.remove('mode-close');
    render();
  }

  ltArea.addEventListener('input', () => {
    if (!longTextTarget) return;
    grid[longTextTarget.block][longTextTarget.c] = ltArea.value;
    syncMirror(longTextTarget.block, longTextTarget.c);
    scheduleSave();
  });

  let bigButtonHeld = false, heldPointerId = null, bigHoverCell = null;
  bigBtn.addEventListener('pointerdown', (e) => {
    bigButtonHeld = true;
    heldPointerId = e.pointerId;
    bigBtn.classList.add('pressed');
  });
  document.addEventListener('pointermove', (e) => {
    if (!bigButtonHeld || e.pointerId !== heldPointerId || longTextTarget) return;
    if (bigHoverCell){ bigHoverCell.classList.remove('dropTarget'); bigHoverCell = null; }
    const under = document.elementFromPoint(e.clientX, e.clientY);
    const cand = under ? under.closest('.cell') : null;
    if (cand && boardEl.contains(cand)){ cand.classList.add('dropTarget'); bigHoverCell = cand; }
  });
  document.addEventListener('pointerup', (e) => {
    if (e.pointerId !== heldPointerId) return;
    const wasHeld = bigButtonHeld;
    bigButtonHeld = false; heldPointerId = null;
    bigBtn.classList.remove('pressed');
    if (bigHoverCell){ bigHoverCell.classList.remove('dropTarget'); bigHoverCell = null; }
    if (!wasHeld) return;

    // iOS keeps touch events targeted at the element pointerdown started on, regardless of
    // where the finger is at release, so find the real element under the finger ourselves.
    const under = document.elementFromPoint(e.clientX, e.clientY);
    const onButton = !!(under && (under === bigBtn || bigBtn.contains(under)));
    const cellEl = under ? under.closest('.cell') : null;

    if (longTextTarget){
      if (onButton) closeLongText();
      return;
    }
    if (cellEl && boardEl.contains(cellEl)){
      openLongText(Number(cellEl.dataset.c));
    }
  });
  document.addEventListener('pointercancel', (e) => {
    if (e.pointerId === heldPointerId){
      bigButtonHeld = false; heldPointerId = null;
      bigBtn.classList.remove('pressed');
      if (bigHoverCell){ bigHoverCell.classList.remove('dropTarget'); bigHoverCell = null; }
    }
  });

  document.addEventListener('pointerdown', (e) => {
    const active = document.activeElement;
    if (active && active.tagName === 'TEXTAREA' && boardEl.contains(active) && !e.target.closest('.cell')){
      active.blur();
    }
  });

  loadData();
})();
</script>
</body>
</html>
